.card{width:100%;max-width:520px;background:var(--card);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:3px solid var(--red);border-radius:14px;padding:40px 32px;text-align:center;box-shadow:0 10px 40px rgba(31,77,58,.18)}

input:focus,input:focus-visible{outline:none}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{display:block;margin:18px auto 0;font:inherit;font-weight:600;font-size:1.05rem;color:#fff;background:var(--red);border:0;border-radius:10px;padding:12px 34px;cursor:pointer}
button:hover{background:var(--red-dark)}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:1.4em;margin:12px 0 0;font-size:1rem;color:var(--red-dark)}
.name{color:var(--red);font-weight:700}
.reveal h1{color:var(--green);margin:0;font-size:clamp(1.9rem,7vw,2.8rem);line-height:1.25}
.reveal .name{color:var(--red)}
.note{margin:26px 0 0;font-size:min(.85rem,2.5vw);line-height:1.5;white-space:nowrap;color:#6b6b6b}

<body>
<main class="card" id="home">
  <h1>Welcome to Secret Santa 2026</h1>
  <p>Enter your unique code below to discover who you’ll be gifting to.</p>
  <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Your four-digit code">
  <button id="go" type="button">Reveal my match</button>
  <p class="err" id="err" role="alert"></p>
</main>
<main class="card reveal" id="result" hidden>
  <h1>Hi <span class="name" id="giver"></span>, you’re buying for <span class="name" id="recipient"></span>.</h1>
  <p class="note">Just a little note: Please keep gifts to a maximum value of $150.</p>
</main>
<script>
const D = {"salt": "BtKHsEt6WzyUr7W1gWZjsQ==", "iter": 300000, "entries": [{"iv": "og15ixtVRSJGt0zS", "ct": "dNhLCmQdONKPmncl5nQVCYw++JQnXM6slb0UFgVbY9o/K9wd2ovtJ+5i"}, {"iv": "ywjFOBqctb09u1Td", "ct": "AsfbTU0QK/c1XICcdO9YlLccq2V8xwZLvTWQRWECy7Byw3KHR5RkcNQABPe4"}, {"iv": "t6kXa+JzqVPdjozj", "ct": "xqdNoSoHaolYShbdZrK7RPzXmw9ncqiIDSTfXR1AqaDGANEnpHHZ7Pgt"}, {"iv": "xXtwwMIhiraVCDFb", "ct": "i6shPCfFjXBhkcQo+c4R+vwuCYMXW7/1bVVY49TJWfAB/moPaW8H+dKl"}, {"iv": "2savkg/5NCsf4dIN", "ct": "39BeSDbsGRV0ne7BAkPD2634trZQaIoPSvxrCgh8wjJa3PEFJn0YTX9+xQ4="}, {"iv": "qk1v/OxFE37Sj7DH", "ct": "n0tb2X7UM+IW8kfX2RfCTxtWUneRnY4ZCKL0WI+ndek1k2cXAvc95e/qYA=="}]};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function lookup(code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(D.salt), iterations:D.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  for (const e of D.entries){
    try{
      const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(e.iv)}, key, b64(e.ct));
      return JSON.parse(new TextDecoder().decode(pt));
    }catch(_){}
  }
  return null;
}
const input = document.getElementById("code"), btn = document.getElementById("go"), err = document.getElementById("err");
async function submit(){
  const code = input.value.trim();
  err.textContent = "";
  if(!/^\d{4}$/.test(code)){ err.textContent = "Enter your four-digit code."; return; }
  btn.disabled = true;
  try{
    const r = await lookup(code);
    if(!r){ err.textContent = "That code didn’t work. Check it and try again."; return; }
    document.getElementById("giver").textContent = r.g;
    document.getElementById("recipient").textContent = r.r;
    document.getElementById("home").hidden = true;
    document.getElementById("result").hidden = false;
  }catch(_){ err.textContent = "Something went wrong. Try a different browser."; }
  finally{ btn.disabled = false; }
}
btn.addEventListener("click", submit);
input.addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
</script>
